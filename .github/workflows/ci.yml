name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        json: [with-jq, without-jq]
    name: test (${{ matrix.json }})
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
          if [ "${{ matrix.json }}" = "with-jq" ]; then
            sudo apt-get install -y jq
          else
            sudo apt-get remove -y jq || true
          fi

      - name: ShellCheck
        run: shellcheck --severity=warning bin/harness lib/*.sh generators/*.sh

      - name: Zero-dependency test runner
        run: bash tests/run.sh

      - name: Bats unit tests
        run: bats tests/bats

      - name: Goldens are up to date
        run: |
          bash tests/golden.sh
          if ! git diff --quiet -- tests/golden; then
            echo "::error::Golden fixtures are stale. Run tests/golden.sh and commit."
            git --no-pager diff -- tests/golden
            exit 1
          fi
