# Gastown sandbox — base compose (adapted from gastownhall/gastown).
# Generated by harness. DO NOT EDIT: put project changes in
# docker-compose.override.yml and run both files together:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
# Regenerated by `harness build`.
services:
  gastown:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GASTOWN_REF: ${GASTOWN_REF:-main}
    container_name: gastown-sandbox
    # Isolation: the agents run inside this container and can only touch the
    # project mounted at /gt — not the rest of your host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_RAW
    environment:
      IS_SANDBOX: 1
      GIT_USER: ${GIT_USER:-TestUser}
      GIT_EMAIL: ${GIT_EMAIL:-test@example.com}
    volumes:
      - agent-home:/home/agent
      # ${FOLDER} (or, by default, the project root two levels up) is mounted at /gt.
      - ${FOLDER:-../..}:/gt
      - dolt-data:/gt/.dolt-data
    ports:
      # Host ${DASHBOARD_PORT} -> container 8080 (the Gastown web dashboard).
      - "${DASHBOARD_PORT:-8080}:8080"
    command: sleep infinity

volumes:
  agent-home:
  dolt-data:
